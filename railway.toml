# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python ameer_server.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ─── P0.4: Production Data Persistence ────────────────────────────────────────
# Mount a Railway Persistent Volume at /app/.ameer so that all .ameer/*.json
# state files (state, decisions, feedback, preferences, plans, …) survive
# redeployments.
#
# Setup steps (Railway Dashboard → your service → Volumes):
#   1. Create a new Persistent Volume (any name, e.g. "ameer-data").
#   2. Set the Mount Path to:  /app/.ameer
#   3. Add the environment variable below so the server knows where state lives.
#
# Environment variable required:
#   AMEER_DATA_DIR=/app/.ameer
#
# The server will derive the .ameer directory from this value automatically.
# No other configuration or code changes are needed.
# ──────────────────────────────────────────────────────────────────────────────
