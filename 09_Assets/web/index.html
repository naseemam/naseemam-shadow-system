<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>أمير</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --user-bg: #eff6ff;
      --user-border: #bfdbfe;
      --ameer-bg: #f8fafc;
      --success: #16a34a;
      --error: #dc2626;
      --radius: 18px;
      --radius-sm: 12px;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Tahoma, "Arabic UI Text", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ─── Layout ─────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 0 env(safe-area-inset-bottom, 0);
    }

    /* ─── Header ─────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    #statusBadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(22,163,74,0.10);
      color: var(--success);
      transition: background 0.3s, color 0.3s;
    }

    #statusBadge.offline {
      background: rgba(220,38,38,0.10);
      color: var(--error);
    }

    #statusBadge.checking {
      background: rgba(100,116,139,0.10);
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ─── Messages ───────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #messages:empty::before {
      content: "راجعت الحالة العامة، وحددي الآن القرار أو المهمة التي يجب حسمها أولًا.";
      color: var(--muted);
      font-size: 16px;
      text-align: center;
      margin: auto;
      padding: 40px 0;
    }

    .msg {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      line-height: 1.65;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-start;
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--ink);
    }

    .msg.ameer {
      align-self: flex-end;
      background: var(--ameer-bg);
      border: 1px solid var(--border);
      color: var(--ink);
    }

    .msg.error {
      align-self: flex-end;
      background: rgba(220,38,38,0.06);
      border: 1px solid rgba(220,38,38,0.18);
      color: var(--error);
    }

    .msg.typing {
      align-self: flex-end;
      background: var(--ameer-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-style: italic;
    }

    /* ─── Composer ───────────────────────────────────────────────── */
    #composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      min-height: 46px;
      max-height: 160px;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      line-height: 1.5;
      overflow-y: auto;
    }

    #input:focus {
      border-color: rgba(37,99,235,0.4);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    #input::placeholder { color: var(--muted); }

    #sendBtn {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #sendBtn:hover:not(:disabled)  { background: var(--accent-dark); }
    #sendBtn:active:not(:disabled) { transform: scale(0.93); }
    #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ─── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #messages { padding: 14px; }
      #composer  { padding: 10px 12px; }
      .msg { max-width: 92%; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app">

    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        أمير
      </div>
      <div id="statusBadge" class="checking">
        <span class="status-dot"></span>
        <span id="statusText">جارٍ الاتصال...</span>
      </div>
    </header>

    <div id="messages" role="log" aria-live="polite" aria-label="المحادثة"></div>

    <div id="composer">
      <textarea
        id="input"
        placeholder="اكتب رسالة..."
        rows="1"
        autocomplete="off"
        aria-label="رسالتك"
      ></textarea>
      <button id="sendBtn" aria-label="إرسال" disabled>
        &#x27A4;
      </button>
    </div>

  </div>

  <script>
  (function () {
    "use strict";

    // ── State ──────────────────────────────────────────────────────
    var busy   = false;
    var online = false;

    // ── DOM refs ───────────────────────────────────────────────────
    var msgBox     = document.getElementById("messages");
    var inputEl    = document.getElementById("input");
    var sendBtn    = document.getElementById("sendBtn");
    var statusBadge = document.getElementById("statusBadge");
    var statusText  = document.getElementById("statusText");

    // ── Health check ───────────────────────────────────────────────
    function checkHealth() {
      fetch("/health")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) {
          if (d && d.status === "ok") {
            online = true;
            statusBadge.className = "";
            statusText.textContent = "🟢 أمير متصل";
            sendBtn.disabled = busy;
          } else {
            setOffline();
          }
        })
        .catch(setOffline);
    }

    function setOffline() {
      online = false;
      statusBadge.className = "offline";
      statusText.textContent = "🔴 غير متصل";
      sendBtn.disabled = true;
    }

    checkHealth();
    setInterval(checkHealth, 15000);

    // ── Auto-grow textarea ─────────────────────────────────────────
    inputEl.addEventListener("input", function () {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });

    // ── Send on Enter (Shift+Enter = newline) ──────────────────────
    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) send();
      }
    });

    sendBtn.addEventListener("click", send);

    // ── Render a message bubble ────────────────────────────────────
    function addMsg(text, role) {
      var el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      msgBox.appendChild(el);
      msgBox.scrollTop = msgBox.scrollHeight;
      return el;
    }

    // ── Send ───────────────────────────────────────────────────────
    function send() {
      var q = inputEl.value.trim();
      if (!q || busy) return;

      busy = true;
      sendBtn.disabled = true;

      // Show user message
      addMsg(q, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";

      // Typing indicator
      var typingEl = addMsg("أمير يفكر...", "typing");

      fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q })
      })
        .then(function (r) {
          if (!r.ok) return Promise.reject(new Error("server_error"));
          return r.json();
        })
        .then(function (data) {
          typingEl.remove();
          var reply = (data && (data.reply || data.message)) || "";
          if (!reply) reply = "حاضر، لم أتلقَّ ردًا واضحًا. هل تريد إعادة المحاولة؟";
          addMsg(reply, "ameer");
        })
        .catch(function () {
          typingEl.remove();
          addMsg("تعذّر الوصول إلى أمير حاليًا. يرجى المحاولة مرة أخرى.", "error");
        })
        .finally(function () {
          busy = false;
          sendBtn.disabled = !online;
          inputEl.focus();
        });
    }

  })();
  </script>
</body>
</html>
