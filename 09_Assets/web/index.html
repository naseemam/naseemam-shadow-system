<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>أمير</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --user-bg: #eff6ff;
      --user-border: #bfdbfe;
      --ameer-bg: #f8fafc;
      --success: #16a34a;
      --error: #dc2626;
      --radius: 18px;
      --radius-sm: 12px;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Tahoma, "Arabic UI Text", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ─── Layout ─────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 0 env(safe-area-inset-bottom, 0);
    }

    /* ─── Header ─────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    #statusBadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(22,163,74,0.10);
      color: var(--success);
      transition: background 0.3s, color 0.3s;
    }

    #statusBadge.offline {
      background: rgba(220,38,38,0.10);
      color: var(--error);
    }

    #statusBadge.checking {
      background: rgba(100,116,139,0.10);
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ─── Messages ───────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #messages:empty::before {
      content: "راجعت الحالة العامة، وحددي الآن القرار أو المهمة التي يجب حسمها أولًا.";
      color: var(--muted);
      font-size: 16px;
      text-align: center;
      margin: auto;
      padding: 40px 0;
    }

    .msg {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      line-height: 1.65;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-start;
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--ink);
    }

    .msg.ameer {
      align-self: flex-end;
      background: var(--ameer-bg);
      border: 1px solid var(--border);
      color: var(--ink);
    }

    .msg.error {
      align-self: flex-end;
      background: rgba(220,38,38,0.06);
      border: 1px solid rgba(220,38,38,0.18);
      color: var(--error);
    }

    .msg.typing {
      align-self: flex-end;
      background: var(--ameer-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-style: italic;
    }

    /* ─── Composer ───────────────────────────────────────────────── */
    #composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      min-height: 46px;
      max-height: 160px;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      line-height: 1.5;
      overflow-y: auto;
    }

    #input:focus {
      border-color: rgba(37,99,235,0.4);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    #input::placeholder { color: var(--muted); }

    #sendBtn {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #sendBtn:hover:not(:disabled)  { background: var(--accent-dark); }
    #sendBtn:active:not(:disabled) { transform: scale(0.93); }
    #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ─── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #messages { padding: 14px; }
      #composer  { padding: 10px 12px; }
      .msg { max-width: 92%; font-size: 14px; }
    }

    /* ─── Pipeline Panel ─────────────────────────────────────────── */
    #pipelineToggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    #pipelineToggle.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    #pipelinePanel {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #pipelinePanel.open { display: flex; }

    .pipeline-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    #pipelineInput {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      direction: rtl;
    }
    #pipelineInput:focus {
      border-color: rgba(37,99,235,.4);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    #pipelineRunBtn {
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #pipelineRunBtn:hover:not(:disabled) { background: var(--accent-dark); }
    #pipelineRunBtn:disabled { opacity: .45; cursor: not-allowed; }

    #pipelineTrace {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #pipelineTrace.visible { display: flex; }

    .pipe-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      position: relative;
    }
    .pipe-step.ok  { border-color: #bbf7d0; background: #f0fdf4; }
    .pipe-step.err { border-color: #fecaca; background: #fff5f5; }
    .pipe-step.run { border-color: #bfdbfe; background: #eff6ff; }

    .pipe-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .pipe-body { flex: 1; }
    .pipe-name  { font-weight: 700; color: var(--ink); margin-bottom: 2px; }
    .pipe-detail { color: var(--muted); line-height: 1.5; }

    .pipe-files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .pipe-file {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 9px;
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
    }

    .pipe-preview-btn {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: var(--success);
      color: white;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .pipe-preview-btn:hover { opacity: .85; }

    .inline-trace {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 6px 0 4px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div id="app">

    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        أمير
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="pipelineToggle">⚙ Pipeline</button>
        <div id="statusBadge" class="checking">
          <span class="status-dot"></span>
          <span id="statusText">جارٍ الاتصال...</span>
        </div>
      </div>
    </header>

    <!-- ─── Pipeline Panel ──────────────────────────────────────── -->
    <div id="pipelinePanel">
      <div class="pipeline-row">
        <input
          id="pipelineInput"
          type="text"
          placeholder="مثال: ابنِ الصفحة الرئيسية"
          value="ابنِ الصفحة الرئيسية"
        />
        <button id="pipelineRunBtn">▶ نفّذ</button>
      </div>
      <div id="pipelineTrace"></div>
    </div>

    <div id="messages" role="log" aria-live="polite" aria-label="المحادثة"></div>

    <div id="composer">
      <textarea
        id="input"
        placeholder="اكتب رسالة..."
        rows="1"
        autocomplete="off"
        aria-label="رسالتك"
      ></textarea>
      <button id="sendBtn" aria-label="إرسال" disabled>
        &#x27A4;
      </button>
    </div>

  </div>

  <script>
  (function () {
    "use strict";

    // ── State ──────────────────────────────────────────────────────
    var busy   = false;
    var online = false;

    // ── DOM refs ───────────────────────────────────────────────────
    var msgBox     = document.getElementById("messages");
    var inputEl    = document.getElementById("input");
    var sendBtn    = document.getElementById("sendBtn");
    var statusBadge = document.getElementById("statusBadge");
    var statusText  = document.getElementById("statusText");

    // ── Health check ───────────────────────────────────────────────
    function checkHealth() {
      fetch("/health")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) {
          if (d && d.status === "ok") {
            online = true;
            statusBadge.className = "";
            statusText.textContent = "🟢 أمير متصل";
            sendBtn.disabled = busy;
          } else {
            setOffline();
          }
        })
        .catch(setOffline);
    }

    function setOffline() {
      online = false;
      statusBadge.className = "offline";
      statusText.textContent = "🔴 غير متصل";
      sendBtn.disabled = true;
    }

    checkHealth();
    setInterval(checkHealth, 15000);

    // ── Auto-grow textarea ─────────────────────────────────────────
    inputEl.addEventListener("input", function () {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });

    // ── Pipeline Panel ─────────────────────────────────────────────
    var pipelineToggle = document.getElementById("pipelineToggle");
    var pipelinePanel  = document.getElementById("pipelinePanel");
    var pipelineInput  = document.getElementById("pipelineInput");
    var pipelineRunBtn = document.getElementById("pipelineRunBtn");
    var pipelineTrace  = document.getElementById("pipelineTrace");

    pipelineToggle.addEventListener("click", function () {
      var open = pipelinePanel.classList.toggle("open");
      pipelineToggle.classList.toggle("active", open);
    });

    pipelineRunBtn.addEventListener("click", runPipeline);
    pipelineInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") runPipeline();
    });

    function stepIcon(status) {
      if (status === "completed" || status === "passed" || status === "accepted") return "✅";
      if (status === "no_match" || status === "blocked" || status === "rejected") return "❌";
      return "⏳";
    }
    function stepClass(status) {
      if (status === "completed" || status === "passed" || status === "accepted") return "ok";
      if (status === "no_match" || status === "blocked" || status === "rejected") return "err";
      return "run";
    }

    function renderTrace(trace) {
      pipelineTrace.innerHTML = "";
      pipelineTrace.classList.add("visible");

      var steps = trace.pipeline || [];
      steps.forEach(function (step) {
        var div = document.createElement("div");
        div.className = "pipe-step " + stepClass(step.status);

        var iconEl = document.createElement("span");
        iconEl.className = "pipe-icon";
        iconEl.textContent = stepIcon(step.status);

        var body = document.createElement("div");
        body.className = "pipe-body";

        var name = document.createElement("div");
        name.className = "pipe-name";
        name.textContent = step.name;

        var detail = document.createElement("div");
        detail.className = "pipe-detail";

        var out = step.output || {};

        if (step.name.indexOf("TaskDecomposer") !== -1) {
          detail.textContent = "النية: " + (out.intent || "—") + " • المهام: " + (out.task_count || 0);
          if (out.tasks && out.tasks.length) {
            var filesDiv = document.createElement("div");
            filesDiv.className = "pipe-files";
            out.tasks.forEach(function (t) {
              var chip = document.createElement("span");
              chip.className = "pipe-file";
              chip.textContent = t.description || t.id;
              filesDiv.appendChild(chip);
            });
            body.appendChild(name);
            body.appendChild(detail);
            body.appendChild(filesDiv);
            div.appendChild(iconEl);
            div.appendChild(body);
            pipelineTrace.appendChild(div);
            return;
          }
        } else if (step.name.indexOf("PlanValidator") !== -1) {
          detail.textContent = step.status === "passed"
            ? "✔ جميع المهام صالحة للتنفيذ"
            : "✘ " + (out.blocked || []).join(", ");
        } else if (step.name.indexOf("Scheduler") !== -1) {
          detail.textContent = "مجدولة: " + (out.scheduled || 0) + " • محظورة: " + (out.blocked || 0);
        } else if (step.name.indexOf("FileExecutor") !== -1) {
          detail.textContent = "مكتملة: " + (out.completed || 0) + " • فاشلة: " + (out.failed || 0);
          if (out.files && out.files.length) {
            var filesDiv2 = document.createElement("div");
            filesDiv2.className = "pipe-files";
            out.files.forEach(function (f) {
              var chip = document.createElement("span");
              chip.className = "pipe-file";
              chip.textContent = f;
              filesDiv2.appendChild(chip);
            });
            body.appendChild(name);
            body.appendChild(detail);
            body.appendChild(filesDiv2);
            div.appendChild(iconEl);
            div.appendChild(body);
            pipelineTrace.appendChild(div);
            return;
          }
        } else {
          detail.textContent = JSON.stringify(out).slice(0, 120);
        }

        body.appendChild(name);
        body.appendChild(detail);
        div.appendChild(iconEl);
        div.appendChild(body);
        pipelineTrace.appendChild(div);
      });

      // Final — Preview button
      var final = trace.final || {};
      if (final.accepted && final.preview_path) {
        var previewBtn = document.createElement("a");
        previewBtn.href = "/preview";
        previewBtn.target = "_blank";
        previewBtn.className = "pipe-preview-btn";
        previewBtn.innerHTML = "🔍 فتح Preview";
        pipelineTrace.appendChild(previewBtn);
      }
    }

    function runPipeline() {
      var cmd = pipelineInput.value.trim();
      if (!cmd) return;

      pipelineRunBtn.disabled = true;
      pipelineTrace.innerHTML = "";
      pipelineTrace.classList.add("visible");

      // Show running steps
      var runDiv = document.createElement("div");
      runDiv.className = "pipe-step run";
      var runIcon = document.createElement("span");
      runIcon.className = "pipe-icon";
      runIcon.textContent = "⏳";
      var runBody = document.createElement("div");
      runBody.className = "pipe-body";
      var runName = document.createElement("div");
      runName.className = "pipe-name";
      runName.textContent = "جارٍ التنفيذ...";
      var runDetail = document.createElement("div");
      runDetail.className = "pipe-detail";
      runDetail.textContent = cmd;
      runBody.appendChild(runName);
      runBody.appendChild(runDetail);
      runDiv.appendChild(runIcon);
      runDiv.appendChild(runBody);
      pipelineTrace.appendChild(runDiv);

      fetch("/execute/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          renderTrace(data);
        })
        .catch(function (err) {
          pipelineTrace.innerHTML = "";
          var errDiv = document.createElement("div");
          errDiv.className = "pipe-step err";
          errDiv.innerHTML = "<span class='pipe-icon'>❌</span><div class='pipe-body'><div class='pipe-name'>خطأ</div><div class='pipe-detail'>تعذّر الاتصال بالخادم.</div></div>";
          pipelineTrace.appendChild(errDiv);
          pipelineTrace.classList.add("visible");
        })
        .finally(function () {
          pipelineRunBtn.disabled = false;
        });
    }


    // ── Send on Enter (Shift+Enter = newline) ──────────────────────
    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) send();
      }
    });

    sendBtn.addEventListener("click", send);

    // ── Render a message bubble ────────────────────────────────────
    function addMsg(text, role) {
      var el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      msgBox.appendChild(el);
      msgBox.scrollTop = msgBox.scrollHeight;
      return el;
    }

    // ── Render execution trace inline in the chat ─────────────────
    function addInlineTrace(trace) {
      var container = document.createElement("div");
      container.className = "inline-trace";

      var steps = trace.pipeline || [];
      steps.forEach(function (step) {
        var div = document.createElement("div");
        div.className = "pipe-step " + stepClass(step.status);

        var iconEl = document.createElement("span");
        iconEl.className = "pipe-icon";
        iconEl.textContent = stepIcon(step.status);

        var body = document.createElement("div");
        body.className = "pipe-body";

        var name = document.createElement("div");
        name.className = "pipe-name";
        name.textContent = step.name;

        var detail = document.createElement("div");
        detail.className = "pipe-detail";

        var out = step.output || {};

        if (step.name.indexOf("TaskDecomposer") !== -1) {
          detail.textContent = "النية: " + (out.intent || "—") + " • المهام: " + (out.task_count || 0);
          if (out.tasks && out.tasks.length) {
            var filesDiv = document.createElement("div");
            filesDiv.className = "pipe-files";
            out.tasks.forEach(function (t) {
              var chip = document.createElement("span");
              chip.className = "pipe-file";
              chip.textContent = t.description || t.id;
              filesDiv.appendChild(chip);
            });
            body.appendChild(name);
            body.appendChild(detail);
            body.appendChild(filesDiv);
            div.appendChild(iconEl);
            div.appendChild(body);
            container.appendChild(div);
            return;
          }
        } else if (step.name.indexOf("PlanValidator") !== -1) {
          detail.textContent = step.status === "passed"
            ? "✔ جميع المهام صالحة للتنفيذ"
            : "✘ " + (out.blocked || []).join(", ");
        } else if (step.name.indexOf("Scheduler") !== -1) {
          detail.textContent = "مجدولة: " + (out.scheduled || 0) + " • محظورة: " + (out.blocked || 0);
        } else if (step.name.indexOf("FileExecutor") !== -1) {
          detail.textContent = "مكتملة: " + (out.completed || 0) + " • فاشلة: " + (out.failed || 0);
          if (out.files && out.files.length) {
            var filesDiv2 = document.createElement("div");
            filesDiv2.className = "pipe-files";
            out.files.forEach(function (f) {
              var chip = document.createElement("span");
              chip.className = "pipe-file";
              chip.textContent = f;
              filesDiv2.appendChild(chip);
            });
            body.appendChild(name);
            body.appendChild(detail);
            body.appendChild(filesDiv2);
            div.appendChild(iconEl);
            div.appendChild(body);
            container.appendChild(div);
            return;
          }
        } else {
          detail.textContent = JSON.stringify(out).slice(0, 120);
        }

        body.appendChild(name);
        body.appendChild(detail);
        div.appendChild(iconEl);
        div.appendChild(body);
        container.appendChild(div);
      });

      var final = trace.final || {};
      if (final.accepted && final.preview_path) {
        var previewBtn = document.createElement("a");
        previewBtn.href = "/preview";
        previewBtn.target = "_blank";
        previewBtn.className = "pipe-preview-btn";
        previewBtn.innerHTML = "🔍 فتح Preview";
        container.appendChild(previewBtn);
      }

      msgBox.appendChild(container);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    // ── Send ───────────────────────────────────────────────────────
    function send() {
      var q = inputEl.value.trim();
      if (!q || busy) return;

      busy = true;
      sendBtn.disabled = true;

      // Show user message
      addMsg(q, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";

      // Typing indicator
      var typingEl = addMsg("أمير يفكر...", "typing");

      fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q })
      })
        .then(function (r) {
          if (!r.ok) return Promise.reject(new Error("server_error"));
          return r.json();
        })
        .then(function (data) {
          typingEl.remove();
          var reply = (data && (data.reply || data.message)) || "";
          if (!reply) reply = "حاضر، لم أتلقَّ ردًا واضحًا. هل تريد إعادة المحاولة؟";
          addMsg(reply, "ameer");
          if (data && data.execution_trace) {
            addInlineTrace(data.execution_trace);
          }
        })
        .catch(function () {
          typingEl.remove();
          addMsg("تعذّر الوصول إلى أمير حاليًا. يرجى المحاولة مرة أخرى.", "error");
        })
        .finally(function () {
          busy = false;
          sendBtn.disabled = !online;
          inputEl.focus();
        });
    }

  })();
  </script>
</body>
</html>
