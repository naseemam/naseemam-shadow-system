#:schema node_modules/wrangler/config-schema.json
name = "shadow-system"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare Workers AI — powers Ameer's intelligence
[ai]
binding = "AI"

# D1 database — stores users, conversations, messages, memory, audit log
[[d1_databases]]
binding = "DB"
database_name = "shadow-system-db"
database_id = "10183848-4cc7-4198-b8c7-1374015ab09c"
